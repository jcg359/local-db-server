services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: happy!2dothat
      MYSQL_DATABASE: giftsdb
      MYSQL_USER: 'joeuser'
      MYSQL_PASSWORD: 'jopassword'
    ports:
      - "3306:3306"

  python-app:
    build: ./python-server
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      MYSQL_HOST: mysql
    depends_on:
      - mysql

